<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="55%"  stop-color="#1a2233"/>
      <stop offset="100%" stop-color="#263040"/>
    </linearGradient>
    <linearGradient id="ground-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#151d2a"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="haze-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a7fa0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a7fa0" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="blur-b">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <pattern id="grain-b" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" fill-opacity="0.018"/>
      <circle cx="3" cy="3" r="0.4" fill="#ffffff" fill-opacity="0.012"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#sky-b)"/>

  <!-- Atmospheric haze layer -->
  <rect width="1200" height="675" fill="url(#haze-b)"/>

  <!-- Far mountains – very dark, desaturated -->
  <path d="M0 480 L80 390 L160 430 L260 350 L360 400 L440 320 L520 370 L600 290 L680 340 L760 300 L840 370 L920 310 L1000 360 L1080 290 L1160 340 L1200 310 L1200 675 L0 675 Z"
        fill="#111824" filter="url(#blur-b)"/>

  <!-- Near mountains – slightly lighter -->
  <path d="M0 530 L100 460 L200 500 L320 430 L420 475 L540 410 L640 455 L760 400 L860 445 L960 405 L1060 450 L1160 415 L1200 440 L1200 675 L0 675 Z"
        fill="#16202e"/>

  <!-- Ground plane -->
  <rect y="570" width="1200" height="105" fill="url(#ground-b)"/>

  <!-- Horizon glow – very subtle cold blue -->
  <ellipse cx="600" cy="490" rx="520" ry="60" fill="#3a5f80" fill-opacity="0.08"/>

  <!-- Film grain overlay -->
  <rect width="1200" height="675" fill="url(#grain-b)"/>

  <!-- Vignette -->
  <radialGradient id="vig-b" cx="50%" cy="50%" r="70%">
    <stop offset="0%"   stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1200" height="675" fill="url(#vig-b)"/>

  <!-- Scan line texture -->
  <rect width="1200" height="675" fill="none" stroke="#ffffff" stroke-opacity="0.012" stroke-width="1"
        style="background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 3px)"/>

  <!-- BEFORE label -->
  <rect x="40" y="610" width="84" height="26" rx="13" fill="#000000" fill-opacity="0.55"/>
  <text x="82" y="627" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="700" letter-spacing="2.5" text-anchor="middle"
        fill="#ffffff" fill-opacity="0.80">BEFORE</text>

  <!-- Upload hint -->
  <text x="600" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="0.5" text-anchor="middle"
        fill="#ffffff" fill-opacity="0.18">Upload before image</text>

  <!-- Camera aperture icon – centre -->
  <g transform="translate(600,260)" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2">
    <circle cx="0" cy="0" r="22"/>
    <circle cx="0" cy="0" r="14"/>
    <line x1="0" y1="-22" x2="0" y2="-14"/>
    <line x1="0" y1="14"  x2="0" y2="22"/>
    <line x1="-22" y1="0" x2="-14" y2="0"/>
    <line x1="14"  y1="0" x2="22"  y2="0"/>
    <line x1="-15.6" y1="-15.6" x2="-9.9" y2="-9.9"/>
    <line x1="9.9"   y1="9.9"   x2="15.6" y2="15.6"/>
    <line x1="15.6"  y1="-15.6" x2="9.9"  y2="-9.9"/>
    <line x1="-9.9"  y1="9.9"   x2="-15.6" y2="15.6"/>
  </g>
</svg>
