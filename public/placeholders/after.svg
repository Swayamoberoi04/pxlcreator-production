<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e0a05"/>
      <stop offset="40%"  stop-color="#1c1205"/>
      <stop offset="75%"  stop-color="#2e1f08"/>
      <stop offset="100%" stop-color="#3d2a0c"/>
    </linearGradient>
    <linearGradient id="ground-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e1508"/>
      <stop offset="100%" stop-color="#0c0905"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="62%" cy="52%" r="45%">
      <stop offset="0%"   stop-color="#FFD60A" stop-opacity="0.22"/>
      <stop offset="40%"  stop-color="#e8860a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c45a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon-glow" cx="50%" cy="73%" r="50%">
      <stop offset="0%"   stop-color="#d4720a" stop-opacity="0.28"/>
      <stop offset="60%"  stop-color="#b85e00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b85e00" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-a">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="soft-a">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <pattern id="grain-a" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" fill-opacity="0.022"/>
      <circle cx="3" cy="3" r="0.4" fill="#FFD60A" fill-opacity="0.008"/>
    </pattern>
  </defs>

  <!-- Sky base -->
  <rect width="1200" height="675" fill="url(#sky-a)"/>

  <!-- Sun glow -->
  <rect width="1200" height="675" fill="url(#sun-glow)"/>

  <!-- Horizon warm glow -->
  <rect width="1200" height="675" fill="url(#horizon-glow)"/>

  <!-- Far mountains – warm-toned, dark amber -->
  <path d="M0 480 L80 390 L160 430 L260 350 L360 400 L440 320 L520 370 L600 290 L680 340 L760 300 L840 370 L920 310 L1000 360 L1080 290 L1160 340 L1200 310 L1200 675 L0 675 Z"
        fill="#1a1005" filter="url(#blur-a)"/>

  <!-- Atmospheric warm mist on mountains -->
  <path d="M0 480 L80 390 L160 430 L260 350 L360 400 L440 320 L520 370 L600 290 L680 340 L760 300 L840 370 L920 310 L1000 360 L1080 290 L1160 340 L1200 310 L1200 500 L0 500 Z"
        fill="#c4720a" fill-opacity="0.06" filter="url(#soft-a)"/>

  <!-- Near mountains – warm dark amber -->
  <path d="M0 530 L100 460 L200 500 L320 430 L420 475 L540 410 L640 455 L760 400 L860 445 L960 405 L1060 450 L1160 415 L1200 440 L1200 675 L0 675 Z"
        fill="#1c1408"/>

  <!-- Ground plane -->
  <rect y="570" width="1200" height="105" fill="url(#ground-a)"/>

  <!-- Warm atmospheric haze at horizon line -->
  <ellipse cx="600" cy="490" rx="600" ry="80" fill="#c47800" fill-opacity="0.12"/>
  <ellipse cx="600" cy="490" rx="350" ry="45" fill="#FFD60A" fill-opacity="0.06"/>

  <!-- Lens flare streak -->
  <line x1="300" y1="240" x2="900" y2="500" stroke="#FFD60A" stroke-opacity="0.04" stroke-width="80"/>

  <!-- Film grain overlay -->
  <rect width="1200" height="675" fill="url(#grain-a)"/>

  <!-- Cinematic letterbox bars -->
  <rect width="1200" height="26"  fill="#000000" fill-opacity="0.45"/>
  <rect y="649"  width="1200" height="26" fill="#000000" fill-opacity="0.45"/>

  <!-- Vignette -->
  <radialGradient id="vig-a" cx="50%" cy="50%" r="70%">
    <stop offset="0%"   stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.60"/>
  </radialGradient>
  <rect width="1200" height="675" fill="url(#vig-a)"/>

  <!-- AFTER label -->
  <rect x="40" y="610" width="72" height="26" rx="13" fill="#FFD60A" fill-opacity="0.15"/>
  <rect x="40" y="610" width="72" height="26" rx="13" fill="none" stroke="#FFD60A" stroke-opacity="0.40" stroke-width="1"/>
  <text x="76" y="627" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="700" letter-spacing="2.5" text-anchor="middle"
        fill="#FFD60A" fill-opacity="0.90">AFTER</text>

  <!-- Upload hint -->
  <text x="600" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="0.5" text-anchor="middle"
        fill="#ffffff" fill-opacity="0.20">Upload after image</text>

  <!-- Camera aperture icon – warm-tinted -->
  <g transform="translate(600,260)" fill="none" stroke="#FFD60A" stroke-opacity="0.20" stroke-width="1.2">
    <circle cx="0" cy="0" r="22"/>
    <circle cx="0" cy="0" r="14"/>
    <line x1="0" y1="-22" x2="0" y2="-14"/>
    <line x1="0" y1="14"  x2="0" y2="22"/>
    <line x1="-22" y1="0" x2="-14" y2="0"/>
    <line x1="14"  y1="0" x2="22"  y2="0"/>
    <line x1="-15.6" y1="-15.6" x2="-9.9" y2="-9.9"/>
    <line x1="9.9"   y1="9.9"   x2="15.6" y2="15.6"/>
    <line x1="15.6"  y1="-15.6" x2="9.9"  y2="-9.9"/>
    <line x1="-9.9"  y1="9.9"   x2="-15.6" y2="15.6"/>
  </g>
</svg>
